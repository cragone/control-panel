<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #1f2933; stroke-width: 2; }
    .label { fill: #1f2933; font-size: 15px; font-weight: 600; }
    .sub { fill: #52606d; font-size: 12px; }
    .pin { fill: #829ab1; font-size: 11px; }
    .w12v { stroke: #c0392b; stroke-width: 2.5; fill: none; }
    .wgnd { stroke: #1f2933; stroke-width: 2.5; fill: none; }
    .w5v  { stroke: #d08a1e; stroke-width: 2.5; fill: none; }
    .wsig { stroke: #2a6fdb; stroke-width: 1.75; fill: none; }
    .dot  { fill: #1f2933; }
  </style>

  <rect x="0" y="0" width="1400" height="940" fill="#fbfbfa"/>
  <text x="24" y="34" font-size="22" font-weight="700" fill="#1f2933">Mower — Wiring Diagram</text>
  <text x="24" y="54" class="sub">Pin names match mower/src/main.cpp. Red = +12V, Orange = +5V, Black = GND, Blue = signal.</text>

  <!-- ===================== POWER CHAIN (top row) ===================== -->
  <g>
    <rect class="box" x="30" y="90" width="150" height="70" rx="6"/>
    <text x="105" y="120" class="label" text-anchor="middle">12V 12Ah SLA</text>
    <text x="105" y="138" class="sub" text-anchor="middle">Battery</text>

    <rect class="box" x="240" y="100" width="120" height="50" rx="6"/>
    <text x="300" y="122" class="label" text-anchor="middle">Main Switch</text>
    <text x="300" y="138" class="sub" text-anchor="middle">50A toggle</text>

    <rect class="box" x="420" y="100" width="120" height="50" rx="6"/>
    <text x="480" y="122" class="label" text-anchor="middle">Inline Fuse</text>
    <text x="480" y="138" class="sub" text-anchor="middle">20A blade</text>

    <rect class="box" x="600" y="100" width="140" height="50" rx="6"/>
    <text x="670" y="122" class="label" text-anchor="middle">E-STOP</text>
    <text x="670" y="138" class="sub" text-anchor="middle">NC contact (cuts power)</text>

    <!-- +12V bus -->
    <path class="w12v" d="M180,125 H240"/>
    <path class="w12v" d="M360,125 H420"/>
    <path class="w12v" d="M540,125 H600"/>
    <path class="w12v" d="M740,125 H1330"/>
    <text x="1345" y="129" class="sub">+12V BUS</text>
  </g>

  <!-- vertical drops from +12V bus to consumers -->
  <path class="w12v" d="M300,150 V125"/>
  <path class="w12v" d="M230,340 V125 H230"/>
  <path class="w12v" d="M230,125 V340"/>
  <path class="w12v" d="M760,125 V300"/>
  <path class="w12v" d="M1060,125 V330"/>

  <!-- ===================== MID ROW: controller + drivers ===================== -->

  <!-- L298N Motor Driver -->
  <rect class="box" x="90" y="340" width="220" height="140" rx="6"/>
  <text x="200" y="365" class="label" text-anchor="middle">L298N Dual H-Bridge</text>
  <text x="105" y="385" class="pin">+12V IN</text>
  <text x="105" y="400" class="pin">GND</text>
  <text x="105" y="415" class="pin">5V logic (from buck)</text>
  <text x="290" y="385" class="pin" text-anchor="end">OUT1/OUT2 → Left motor</text>
  <text x="290" y="400" class="pin" text-anchor="end">OUT3/OUT4 → Right motor</text>
  <text x="105" y="435" class="pin">IN1 ← GPIO25</text>
  <text x="105" y="448" class="pin">IN2 ← GPIO26</text>
  <text x="105" y="461" class="pin">ENA ← GPIO14 (PWM)</text>
  <text x="290" y="435" class="pin" text-anchor="end">IN3 ← GPIO32</text>
  <text x="290" y="448" class="pin" text-anchor="end">IN4 ← GPIO33</text>
  <text x="290" y="461" class="pin" text-anchor="end">ENB ← GPIO13 (PWM)</text>

  <!-- Buck converter -->
  <rect class="box" x="360" y="360" width="150" height="80" rx="6"/>
  <text x="435" y="385" class="label" text-anchor="middle">Buck Converter</text>
  <text x="435" y="402" class="sub" text-anchor="middle">12V → 5V, 5A</text>
  <text x="375" y="422" class="pin">IN+ / IN-</text>
  <text x="500" y="422" class="pin" text-anchor="end">OUT 5V / GND</text>

  <!-- ESP32 -->
  <rect class="box" x="600" y="300" width="220" height="220" rx="8" stroke-width="3"/>
  <text x="710" y="328" class="label" text-anchor="middle" font-size="17">ESP32 Dev Board</text>
  <text x="615" y="350" class="pin">5V / VIN ← buck OUT</text>
  <text x="615" y="365" class="pin">GND ← common ground</text>
  <text x="615" y="390" class="pin">GPIO25 → L298N IN1</text>
  <text x="615" y="404" class="pin">GPIO26 → L298N IN2</text>
  <text x="615" y="418" class="pin">GPIO14 → L298N ENA</text>
  <text x="615" y="432" class="pin">GPIO32 → L298N IN3</text>
  <text x="615" y="446" class="pin">GPIO33 → L298N IN4</text>
  <text x="615" y="460" class="pin">GPIO13 → L298N ENB</text>
  <text x="615" y="478" class="pin">GPIO27 → Relay IN</text>
  <text x="615" y="492" class="pin">GPIO5/18 → HC-SR04 TRIG/ECHO</text>
  <text x="615" y="510" class="pin">GPIO34 ← E-STOP sense (pull-up)</text>

  <!-- Relay module -->
  <rect class="box" x="1000" y="340" width="150" height="110" rx="6"/>
  <text x="1075" y="365" class="label" text-anchor="middle">Relay Module</text>
  <text x="1075" y="382" class="sub" text-anchor="middle">blade cutoff</text>
  <text x="1015" y="402" class="pin">VCC 5V / GND</text>
  <text x="1015" y="417" class="pin">IN ← GPIO27</text>
  <text x="1015" y="435" class="pin">COM/NO → blade circuit</text>

  <!-- HC-SR04 -->
  <rect class="box" x="1000" y="150" width="150" height="80" rx="6"/>
  <text x="1075" y="175" class="label" text-anchor="middle">HC-SR04</text>
  <text x="1075" y="192" class="sub" text-anchor="middle">ultrasonic sensor</text>
  <text x="1015" y="212" class="pin">TRIG ← GPIO5</text>
  <text x="1015" y="224" class="pin">ECHO → GPIO18</text>

  <!-- E-stop sense + pull-up -->
  <rect class="box" x="600" y="600" width="220" height="70" rx="6"/>
  <text x="710" y="625" class="label" text-anchor="middle">E-STOP NO contact</text>
  <text x="710" y="642" class="sub" text-anchor="middle">+ 10k pull-up to 3.3V → GPIO34</text>
  <text x="710" y="658" class="sub" text-anchor="middle">Pressed = pin pulled LOW (FALLING IRQ)</text>

  <!-- signal wires -->
  <path class="wsig" d="M600,390 H310"/>
  <path class="wsig" d="M600,404 H310"/>
  <path class="wsig" d="M600,418 H310"/>
  <path class="wsig" d="M600,432 H310"/>
  <path class="wsig" d="M600,446 H310"/>
  <path class="wsig" d="M600,460 H310"/>
  <path class="wsig" d="M820,478 H1150 V400 H1150"/>
  <path class="wsig" d="M820,492 H960 V190 H1000"/>
  <path class="wsig" d="M820,504 V635 H820"/>
  <path class="w5v"  d="M510,400 H600"/>

  <!-- ===================== BOTTOM: actuators ===================== -->
  <rect class="box" x="60" y="600" width="130" height="70" rx="6"/>
  <text x="125" y="628" class="label" text-anchor="middle">Left Motor</text>
  <text x="125" y="645" class="sub" text-anchor="middle">12V gear motor</text>

  <rect class="box" x="220" y="600" width="130" height="70" rx="6"/>
  <text x="285" y="628" class="label" text-anchor="middle">Right Motor</text>
  <text x="285" y="645" class="sub" text-anchor="middle">12V gear motor</text>

  <rect class="box" x="1000" y="600" width="150" height="70" rx="6"/>
  <text x="1075" y="628" class="label" text-anchor="middle">Blade Motor</text>
  <text x="1075" y="645" class="sub" text-anchor="middle">775 motor, 12V</text>

  <path class="w12v" d="M125,600 V480"/>
  <path class="w12v" d="M285,600 V480"/>
  <path class="wsig" d="M125,600 V480"/>
  <path class="wsig" d="M285,600 V480"/>
  <path class="w12v" d="M1075,600 V450"/>

  <!-- ===================== GROUND BUS ===================== -->
  <path class="wgnd" d="M60,850 H1300"/>
  <text x="1315" y="854" class="sub">GND BUS</text>

  <path class="wgnd" d="M105,160 V850"/>
  <path class="wgnd" d="M105,400 H90 V850"/>
  <path class="wgnd" d="M375,440 V850"/>
  <path class="wgnd" d="M615,365 V850"/>
  <path class="wgnd" d="M1015,402 V850"/>
  <path class="wgnd" d="M1015,224 H960 V850"/>
  <path class="wgnd" d="M125,670 V850"/>
  <path class="wgnd" d="M285,670 V850"/>
  <path class="wgnd" d="M1075,670 V850"/>
  <path class="wgnd" d="M710,670 V850"/>

  <!-- legend -->
  <g transform="translate(30,890)">
    <line x1="0" y1="0" x2="30" y2="0" class="w12v"/>
    <text x="36" y="4" class="sub">+12V power</text>
    <line x1="150" y1="0" x2="180" y2="0" class="w5v"/>
    <text x="186" y="4" class="sub">+5V logic</text>
    <line x1="290" y1="0" x2="320" y2="0" class="wgnd"/>
    <text x="326" y="4" class="sub">GND</text>
    <line x1="390" y1="0" x2="420" y2="0" class="wsig"/>
    <text x="426" y="4" class="sub">Signal / GPIO</text>
  </g>
</svg>
