services:
  broker:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./web/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./broker-data:/mosquitto/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - MQTT_BROKER=broker
    depends_on:
      - broker
